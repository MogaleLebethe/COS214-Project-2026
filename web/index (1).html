<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIVIDY Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">T</span><span>TIVIDY</span></div>

    <div class="side-section">
      <div class="side-title">Workflow definitions</div>
      <div id="definitions" class="side-list"></div>
    </div>

    <div class="side-section grow">
      <div class="side-title">
        Projects
        <span class="side-actions">
          <button class="icon-btn" id="importBtn" title="Import a project from a JSON file">⇪</button>
          <button class="icon-btn" id="newProjectBtn" title="New empty project">+</button>
        </span>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <div id="projects" class="side-list"></div>
    </div>

    <div class="side-foot">Workflow engine board</div>
  </aside>

  <main class="main">
    <section id="welcome" class="welcome">
      <div class="welcome-card">
        <div class="logo big">T</div>
        <h1>Welcome to TIVIDY</h1>
        <p>Start an instance of a workflow definition from the left, or create an empty project.</p>
        <div id="welcomeDefinitions" class="welcome-defs"></div>
      </div>
    </section>

    <section id="projectView" class="project-view" hidden>
      <header class="topbar">
        <div class="title-block">
          <div class="crumbs" id="crumbs"></div>
          <h1 id="projectTitle"></h1>
          <div class="progress-row">
            <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
            <span id="progressText" class="muted"></span>
          </div>
        </div>
        <div class="toolbar">
          <button class="btn ghost" id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
          <button class="btn ghost" id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button>
          <button class="btn ghost" id="exportBtn" title="Download this project as a JSON file">⇩ Export</button>
          <button class="btn ghost" id="cloneBtn" title="Clone this project (Prototype)">⧉ Clone</button>
          <button class="btn primary" id="addTaskBtn">+ Task</button>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button data-view="board" class="active">▦ Board</button>
        <button data-view="list">☰ List</button>
        <button data-view="deps">⛓ Dependencies</button>
        <button data-view="work">✔ My work</button>
        <button data-view="history">⏱ History</button>
        <button data-view="json">{ } JSON</button>
      </nav>

      <div id="stages" class="stages"></div>
      <section id="view" class="view"></section>
    </section>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true"></aside>
  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
